[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tme-quant"
version = "0.1.0.dev0"
description = "Python translation of CurveAlign; curvelet-based quantification and napari plugin"
authors = [{ name = "Eliceiri Lab" }]
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10.1",
  "napari",
  "roifile",
  "numpy>=2.2.6",
  "opencv-python-headless>=4.10.0.84",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pyqt6",
  "qtpy",
  "scikit-image>=0.25.0",
  "scikit-learn>=1.7.1",
  "scipy>=1.15.2",
  "SimpleITK>=2.3.0",
  # ITK v3 registration classes for the default registration_method="matlab"
  # (bit-exact port of MATLAB imregtform used by BDcreation_reg2). SimpleITK
  # cannot expose these classes. Wheels: macOS arm64 / Linux / Windows, py3.11+.
  "itk>=5.3.0,<5.5",
]

[dependency-groups]
dev = [
  "build",
  "pytest",
  "ruff",
]

[project.optional-dependencies]
curvelops = [
  "curvelops @ git+https://github.com/PyLops/curvelops@0.23.4",
]
segmentation = [
  "cellcast",
  "cellpose",
]

[project.entry-points."napari.manifest"]
napari-curvealign = "napari_curvealign:napari.yaml"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
# Wheel vs sdist vs git-dev (see MANIFEST.in and tests/test_packaging.py):
#   wheel   = this [packages.find] + package-data below (src/ only)
#   sdist   = source + CI tests; MANIFEST.in prunes matlab_parity / artifacts
#   git-dev = clone; full MATLAB dump harness + comparison figures

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
napari_curvealign = ["napari.yaml"]
# sRGB ICC profile TRC/colorant/adaptation constants for the MATLAB
# makecform('srgb2lab') port (BDcreation_reg). Regenerated by
# tests/matlab_parity/dump_srgb2lab_components.m (git-dev only).
pycurvelets = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

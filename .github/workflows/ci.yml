name: ci

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # pycurvelets-core alone, with no curvelet backend installed: the
  # backend-dependent tests skip and the boundary tests prove core imports.
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: pycurvelets-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pycurvelets-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Show installed curvelet backends (expected none)
        run: python -c "from pycurvelets.backends import available_backends; print(available_backends())"

      - name: Run core tests
        env:
          TMEQ_RUN_CURVELETS: "0"
        run: |
          pytest -q -rs

  # The UDCT backend is pure Python, so it runs on every PR without secrets.
  test-udct:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pycurvelets-core and pycurvelets-udct
        run: |
          python -m pip install --upgrade pip
          # One command, so pip satisfies udct's pycurvelets-core pin with the checkout.
          python -m pip install -e ./pycurvelets-core -e ./pycurvelets-udct
          python -m pip install pytest
          python -c "from pycurvelets.backends import available_backends; print(available_backends())"

      - name: Run pycurvelets-udct tests
        working-directory: pycurvelets-udct
        run: |
          pytest -q -rs

  # Secure build with CurveLab; skip on forked PRs (no secrets on forks).
  test-fdct:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make wget curl unzip libgl1 libglib2.0-0

      - name: Fetch CurveLab archive
        shell: bash
        env:
          FETCH_FDCT: ${{ secrets.FETCH_FDCT }}
        run: |
          set -euo pipefail
          if [ -z "${FETCH_FDCT}" ]; then
            echo "::error title=Missing secret::FETCH_FDCT is empty. It must download utils/CurveLab-2.1.3.tar.gz."
            exit 1
          fi
          mkdir -p utils
          cd utils
          echo "-- Pre eval --"
          ls -la
          echo "Downloading CurveLab archive via FETCH_FDCT..."
          eval "${FETCH_FDCT}"
          echo "-- Post eval --"
          ls -la
          if [ ! -f "CurveLab-2.1.3.tar.gz" ]; then
            echo "::error title=CurveLab archive missing after FETCH_FDCT::Expected utils/CurveLab-2.1.3.tar.gz to exist after running FETCH_FDCT."
            echo "Files in utils/:"
            ls -la
            exit 1
          fi
          if command -v file >/dev/null 2>&1; then
            echo "Downloaded archive mime-type:"
            MIME="$(file -b --mime-type "CurveLab-2.1.3.tar.gz" || true)"
            echo "${MIME}"
            if [[ "${MIME}" == text/html* ]]; then
              echo "::error title=CurveLab download returned HTML::Likely a 403/redirect. Showing first 40 lines:"
              head -n 40 "CurveLab-2.1.3.tar.gz" || true
              echo "Fix: update FETCH_FDCT to use 'curl --fail-with-body -fL ... -o CurveLab-2.1.3.tar.gz <URL>' so it fails on 403 instead of saving HTML."
              exit 1
            fi
          fi

      - name: Prepare FFTW + CurveLab toolchain
        env:
          FDCT: ""
          FFTW: ""
          CPPFLAGS: ""
          LDFLAGS: ""
        run: |
          unset FDCT FFTW CPPFLAGS LDFLAGS
          bash .github/ci_setup_curvelab.sh

      - name: Validate CurveLab libraries
        run: |
          echo "Testing CurveLab compilation..."
          if [ -z "${FDCT:-}" ]; then
            echo "❌ FDCT environment variable not set by ci_setup_curvelab.sh"
            exit 1
          fi
          echo "FDCT=${FDCT}"
          ls -la "${FDCT}" || true
          ls -la "${FDCT}/fdct_wrapping_cpp/src" || true
          ls -la "${FDCT}/fdct3d/src" || true
          test -f "${FDCT}/fdct_wrapping_cpp/src/libfdct_wrapping.a" && echo "✅ libfdct_wrapping.a built" || (echo "❌ libfdct_wrapping.a missing"; exit 1)
          test -f "${FDCT}/fdct3d/src/libfdct3d.a" && echo "✅ libfdct3d.a built" || (echo "❌ libfdct3d.a missing"; exit 1)

      - name: Install pycurvelets-core and pycurvelets-fdct
        run: |
          python -m pip install --upgrade pip
          # One command, so pip satisfies fdct's pycurvelets-core pin with the checkout.
          python -m pip install -e ./pycurvelets-core -e ./pycurvelets-fdct
          python -m pip install pytest ruff
          python -c "from pycurvelets.backends import available_backends; print(available_backends())"

      - name: Run core tests on the FDCT backend
        working-directory: pycurvelets-core
        env:
          TMEQ_RUN_CURVELETS: "1"
        run: |
          pytest -q -rs

      - name: Run pycurvelets-fdct tests
        working-directory: pycurvelets-fdct
        run: |
          pytest -q -rs

  # Every project must build on its own; the core wheel must also install and
  # import with no backend.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdists and wheels
        run: |
          python -m pip install --upgrade pip build twine
          for project in pycurvelets-core pycurvelets-fdct pycurvelets-udct; do
            python -m build --outdir dist "$project"
          done
          ls -l dist
          python -m twine check dist/*

      - name: Install the core wheel alone and import it
        run: |
          python -m venv /tmp/core-only
          /tmp/core-only/bin/pip install dist/pycurvelets_core-*.whl
          cd /tmp
          /tmp/core-only/bin/python -c "import pycurvelets, pycurvelets.process_image; from pycurvelets.backends import available_backends; assert available_backends() == [], available_backends(); print('core wheel OK, HAS_CURVELETS =', pycurvelets.HAS_CURVELETS)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

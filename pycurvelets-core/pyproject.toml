[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycurvelets-core"
version = "0.1.0.dev0"
description = "Python translation of CurveAlign; curvelet transforms are provided by backend packages (pycurvelets-fdct, pycurvelets-udct)"
authors = [{ name = "Eliceiri Lab" }]
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10.1",
  "numpy>=2.2.6",
  "opencv-python-headless>=4.10.0.84",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "scikit-image>=0.25.0",
  "scikit-learn>=1.7.1",
  "scipy>=1.15.2",
  # ITK v3 (1+1)-ES port of MATLAB imregtform (BDcreation_reg / BDcreation_reg2).
  # Wheels: macOS arm64 / Linux / Windows, py3.11+.
  "itk>=5.3.0,<5.5",
]

[dependency-groups]
dev = [
  "build",
  "pytest",
  "ruff",
]

[project.optional-dependencies]
segmentation = [
  "cellcast",
  "cellpose",
]
fiji = [
  "appose>=0.12,<0.13",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
# Wheel vs sdist (see MANIFEST.in and tests/test_packaging.py):
#   wheel = this [packages.find] + package-data below (src/ only)
#   sdist = source + lightweight tests; registration 1-9 / MATLAB dumps stay in git

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
# sRGB ICC profile TRC/colorant/adaptation constants for the MATLAB
# makecform('srgb2lab') port (BDcreation_reg). Regenerated by
# archive/matlab_parity/dump_srgb2lab_components.m (git / clone only).
pycurvelets = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

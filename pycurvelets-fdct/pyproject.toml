[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycurvelets-fdct"
version = "0.1.0.dev0"
description = "FDCT (CurveLab) curvelet backend for pycurvelets, through curvelops"
readme = "README.md"
authors = [{ name = "Eliceiri Lab" }]
requires-python = ">=3.11"
dependencies = [
  # Released in lockstep with core: the backend Protocol is versioned with it.
  "pycurvelets-core==0.1.0.dev0",
  "numpy>=2.2.6",
  # Not on PyPI. Building it needs FFTW 2.1.5 and CurveLab, located through the
  # FFTW and FDCT environment variables; bin/install.sh sets them up.
  "curvelops @ git+https://github.com/PyLops/curvelops@0.23.4",
]

[project.entry-points."pycurvelets.backends"]
fdct = "pycurvelets_fdct.backend:FDCTBackend"

[dependency-groups]
dev = [
  "pytest",
]

# Local checkout only; not written into the built package metadata.
[tool.uv.sources]
pycurvelets-core = { path = "../pycurvelets-core", editable = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
